<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celebrate with Cake | Häagen-Dazs</title>

<link rel="stylesheet" href="/assets/css/site.css">

<style>
:root {
  --burgundy:#650B32;
  --gold-bg:#FBF3E6;
}
.preview-price {
  font-weight:800;
  color:var(--burgundy);
  font-size:14px;
}
.preview-price span {
  color:rgba(101,11,50,0.7);
  font-weight:700;
}
</style>
</head>

<body>

<main>

<section class="section">
<div class="container">

<div class="form-card">
<div class="form-head">
<strong>Cake Order Form</strong>
</div>

<form id="cakeOrderForm">

<!-- CUSTOMER INFO -->
<div class="grid">
<input name="first_name" placeholder="First Name" required>
<input name="last_name" placeholder="Last Name" required>
<input name="phone" placeholder="(XXX) XXX-XXXX" required>
<input name="email" type="email" placeholder="Email" required>
</div>

<!-- CAKE DESIGN -->
<div class="field">
<label>Cake Design</label>
<select id="cakeDesign" name="cake_design" required>
<option value="">Select a cake</option>
<option>Ribbon Cake</option>
<option>Dulce de Leche Cake</option>
<option>Cookies & Cream Cake</option>
<option>Coffee Crunch Cake</option>
<option>Triple Chocolate Cake</option>
<option>Just Because Cake</option>
</select>
</div>

<!-- PREVIEW -->
<div class="preview-card">
<div>
<strong id="cakePreviewName">Select a cake</strong>
<div class="preview-price" id="cakePriceText">
<span>Price:</span> Select size
</div>
</div>
</div>

<!-- SIZE -->
<div class="field">
<label>Cake Size</label>
<select id="cakeSize" name="cake_size" required>
<option value="">Select size</option>
<option>6x2</option>
<option>6x3</option>
<option>8x2</option>
<option>8x3</option>
<option>10x2</option>
<option>10x3</option>
</select>
</div>

<button type="submit">Submit Order</button>

</form>
</div>
</div>
</section>

</main>

<script>
const PRICE_OTHER = {
  "6x2":41.95,
  "6x3":49.95,
  "8x2":59.95,
  "8x3":69.95,
  "10x2":84.95,
  "10x3":99.95
};

const PRICE_RIBBON = {
  "6x2":49.95,
  "6x3":54.95,
  "8x2":69.95,
  "8x3":79.95,
  "10x2":94.95,
  "10x3":114.95
};

const cakeDesign = document.getElementById("cakeDesign");
const cakeSize = document.getElementById("cakeSize");
const cakePreviewName = document.getElementById("cakePreviewName");
const cakePriceText = document.getElementById("cakePriceText");

function updatePrice() {
  const design = cakeDesign.value;
  const size = cakeSize.value;

  cakePreviewName.textContent = design || "Select a cake";

  if (!size) {
    cakePriceText.innerHTML = "<span>Price:</span> Select size";
    return;
  }

  const table = (design === "Ribbon Cake") ? PRICE_RIBBON : PRICE_OTHER;
  const price = table[size];

  if (!price) {
    cakePriceText.innerHTML = "<span>Price:</span> N/A";
    return;
  }

  cakePriceText.innerHTML = "<span>Price:</span> $" + price.toFixed(2);
}

cakeDesign.addEventListener("change", updatePrice);
cakeSize.addEventListener("change", updatePrice);
</script>

</body>
</html>
